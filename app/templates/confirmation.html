{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body text-center p-5">

            <h1 class="mb-4">🎉 Reservation Confirmed!</h1>

            <p class="lead">
                Thank you, <strong>{{ full_name }}</strong>!
            </p>

            <p>
                Your reservation has been successfully received.
            </p>

            <hr>

            <div class="text-start mt-4">
                <p><strong>Email:</strong> {{ email }}</p>
                <p><strong>Tickets:</strong> {{ tickets }}</p>
            </div>

            <div class="mt-4">
                <a href="{{ url_for('main.events') }}" class="btn btn-primary">
                    Browse Events
                </a>

                <a href="{{ url_for('main.reservations') }}" class="btn btn-outline-secondary">
                    Reservations
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
