{% extends "base.html" %}

{% block title %}
Reserve a Seat | Hav-A-Seat
{% endblock %}

{% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="mb-4">Reserve Your Seats</h2>

            <form method="POST">

                <input type="hidden" name="session_id" value="{{ session_id }}">

                <div class="mb-3">
                    <label for="full_name" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="full_name"
                        name="full_name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="tickets" class="form-label">
                        Number of Tickets
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="tickets"
                        name="tickets"
                        min="1"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-success">
                    Reserve Seats
                </button>

                <a
                    href="{{ url_for('main.events') }}"
                    class="btn btn-secondary"
                >
                    Back to Events
                </a>

            </form>

        </div>
    </div>
</div>

{% endblock %}
