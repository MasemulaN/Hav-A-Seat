name: Hav-A-Seat CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOCKER_IMAGE: masemulan/hav-a-seat

jobs:

  # ---------------------------------------------------------
  # Test Application
  # ---------------------------------------------------------

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q .

  # ---------------------------------------------------------
  # Build and Push Docker Image
  # ---------------------------------------------------------

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ---------------------------------------------------------
  # Deploy to EC2 using AWS Systems Manager
  # ---------------------------------------------------------

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: af-south-1

      - name: Find running application instances
        id: instances
        shell: bash
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=Hav-A-Seat" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running Hav-A-Seat EC2 instances were found."
            exit 1
          fi

          echo "Found instances:"
          echo "$INSTANCE_IDS"

          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy latest image using SSM
        id: deploy
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Project,Values=Hav-A-Seat" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Hav-A-Seat ${GITHUB_SHA}" \
            --parameters 'commands=[
              "set -e",
              "echo Pulling latest Hav-A-Seat image...",
              "docker pull masemulan/hav-a-seat:latest",
              "echo Saving existing container environment...",
              "docker inspect hav-a-seat --format \"{{range .Config.Env}}{{println .}}{{end}}\" > /tmp/hav-a-seat.env",
              "echo Stopping existing container...",
              "docker stop hav-a-seat || true",
              "echo Removing existing container...",
              "docker rm hav-a-seat || true",
              "echo Starting new container...",
              "docker run -d --name hav-a-seat --restart unless-stopped -p 80:5000 --env-file /tmp/hav-a-seat.env masemulan/hav-a-seat:latest",
              "echo Removing temporary environment file...",
              "rm -f /tmp/hav-a-seat.env",
              "echo Deployment completed.",
              "docker ps --filter name=hav-a-seat --format \"table {{.Names}}\\t{{.Image}}\\t{{.Status}}\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        shell: bash
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          echo "Waiting for SSM deployment to complete..."

          for i in {1..30}; do

            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed with status: $STATUS"

                aws ssm list-command-invocations \
                  --command-id "$COMMAND_ID" \
                  --details \
                  --query "CommandInvocations[].CommandPlugins[].Output" \
                  --output text

                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."
          exit 1

      - name: Verify deployment
        shell: bash
        run: |
          aws ssm send-command \
            --targets "Key=tag:Project,Values=Hav-A-Seat" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify Hav-A-Seat deployment" \
            --parameters 'commands=[
              "docker ps --filter name=hav-a-seat --format \"{{.Names}} | {{.Image}} | {{.Status}}\"",
              "docker inspect hav-a-seat --format \"{{.Config.Image}}\""
            ]' \
            --output text

